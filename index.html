<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      GitHub Pages cannot send security headers, so the policy is set here.
      It also enforces the "no external resources at runtime" rule: only files
      from this site may load. data:/blob: are for Phaser's built-in textures.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b0d1a" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>AI AI Captain</title>
    <!--
      Colours come from COLORS in src/graphics/palette.ts via CSS variables (set in
      src/systems/pageChrome.ts). The fallbacks only matter for the first paint.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--color-void, #0b0d1a);
        overflow: hidden;
        touch-action: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* Shown by src/systems/pageChrome.ts when ROTATE_PROMPT_QUERY (config/strings.ts) matches. */
      #rotate-device {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2em;
        background: var(--color-void, #0b0d1a);
        color: var(--color-text, #e8e8f0);
        font-family: monospace;
        font-size: 1.2em;
        text-align: center;
      }
      #rotate-device[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-device" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
